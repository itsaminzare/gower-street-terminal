# Refresh the copy of the OFAC sanctioned-vessel list once a day.
# Some hosting networks can't reach treasury.gov; the server falls back to this copy on GitHub.
name: Refresh OFAC vessel list
on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/update-ofac.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain public-data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public-data/ofac-vessels.json
            git commit -m "Refresh OFAC vessel list"
            git push
          else
            echo "No change"
          fi
