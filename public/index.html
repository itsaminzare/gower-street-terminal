<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="author" content="Mohammadamin Zare, University College London" />
  <meta name="copyright" content="© 2026 Mohammadamin Zare, University College London. All rights reserved." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gower Street Terminal — Hormuz / Bab el-Mandeb</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="topbar">
    <a class="brand" href="/" aria-label="Gower Street Terminal">
      <span class="lg-box"><span class="lg-word">Gower Street</span></span>
      <span class="lg-term">Gower Street Terminal</span>
    </a>
    <span id="demo-banner" hidden>SIMULATED SHIPS</span>
    <nav id="tools" aria-label="Tools">
      <button data-open="flows" title="Daily transits through each chokepoint (IMF PortWatch + this terminal's own counts)">Flows</button>
      <button data-open="curve" title="Brent & WTI futures curves and spreads">Curve</button>
      <button data-open="scenario" title="What-if disruption calculator">Scenario</button>
      <button data-open="research" title="How oil and tanker stocks moved after 20 Persian Gulf / Red Sea incidents since 2019, with an out-of-sample test">Research</button>
      <button data-open="crisis" title="Replay the 2023-24 Red Sea crisis: transits, prices, and what the desk's playbook would have said">Red Sea 2024</button>
      <button data-open="settings" title="Phone alerts and data sources">Alerts</button>
    </nav>
    <div class="right">
      <div class="status-wrap">
        <button id="status-btn" title="Status of every data source">● Data</button>
        <div id="feeds" class="status-pop" hidden></div>
      </div>
      <label class="tog" title="Show only tankers on every map"><input type="checkbox" id="tankers-only" /> Tankers only</label>
      <label class="tog" title="Beep on new alerts"><input type="checkbox" id="sound" /> Sound</label>
      <span id="clock">--:--:-- UTC</span>
    </div>
  </header>

  <section id="ticker"></section>
  <section id="infobar">
    <div id="clocks"></div>
    <div id="spreads" title="Futures spreads in $/bbl. A positive time spread (backwardation) means oil now costs more than later: a sign of supply stress. Click for the full curve."></div>
  </section>

  <main id="grid">
    <section class="panel map-panel" id="p-hormuz" data-zones="HORMUZ,SUEZ">
      <div class="ph">
        <span class="zone-tabs"><button data-z="HORMUZ" class="on">Strait of Hormuz</button><button data-z="SUEZ">Suez</button></span>
        <span class="stats"></span>
        <span class="ph-actions">
          <button class="livemap-btn" title="Switch between VesselFinder's live map (wider coverage, their data) and this terminal's own map">Live map</button>
          <button class="replay-btn" title="Play back the last 24 hours on this terminal's map">Replay</button>
        </span>
      </div>
      <div class="maps"><div class="map" id="map-HORMUZ"></div><div class="map" id="map-SUEZ" hidden></div></div>
      <div class="replay-bar" hidden></div>
    </section>
    <section class="panel map-panel" id="p-bab" data-zones="BAB,CAPE">
      <div class="ph">
        <span class="zone-tabs"><button data-z="BAB" class="on">Bab el-Mandeb</button><button data-z="CAPE">Cape of Good Hope</button></span>
        <span class="stats"></span>
        <span class="ph-actions">
          <button class="livemap-btn" title="Switch between VesselFinder's live map (wider coverage, their data) and this terminal's own map">Live map</button>
          <button class="replay-btn" title="Play back the last 24 hours on this terminal's map">Replay</button>
        </span>
      </div>
      <div class="maps"><div class="map" id="map-BAB"></div><div class="map" id="map-CAPE" hidden></div></div>
      <div class="replay-bar" hidden></div>
    </section>

    <section class="panel" id="p-alerts">
      <div class="ph"><span class="t">Incident alerts <span class="live">● live</span></span><span class="cnt" id="alert-count"></span></div>
      <div class="list" id="alerts"></div>
    </section>

    <section class="panel" id="p-analyst">
      <div class="ph"><span class="t">AI analyst</span>
        <span class="seg" id="an-tabs"><button data-t="brief" class="on">Brief</button><button data-t="desk">Trade desk</button><button data-t="ask">Ask</button></span>
        <button id="run-analyst" class="ghost">Run now</button>
      </div>
      <div class="body" id="analyst"></div>
      <div class="body" id="desk" hidden></div>
      <div class="ask-pane" id="ask" hidden>
        <div class="ask-log" id="ask-log"></div>
        <div id="ask-quota" class="ask-quota"></div>
        <form id="ask-form"><input id="ask-input" autocomplete="off" placeholder="Ask about the live picture… e.g. Why did Brent drop at 14:00?" /><button>ASK</button></form>
      </div>
    </section>

    <!-- One feed panel: news, official statements and social posts behind tabs -->
    <section class="panel" id="p-feed">
      <div class="ph feed-head">
        <span class="feed-tabs">
          <button data-feed="news" class="on">News <b class="n" id="n-news"></b></button>
          <button data-feed="official">Official <b class="n" id="n-official"></b></button>
          <button data-feed="social">Social <b class="n" id="n-social"></b></button>
        </span>
      </div>
      <div class="feed-sub" data-for="news">
        <span class="filters" data-target="news">
          <button data-f="ALL" class="on">All</button><button data-f="HORMUZ">Hormuz</button><button data-f="BAB">Red Sea</button><button data-f="INCIDENT">Incidents</button>
        </span>
      </div>
      <div class="feed-sub" data-for="official" hidden>
        <span class="filters" data-target="official">
          <button data-f="ALL" class="on">All</button><button data-f="HOUTHI">Houthi</button><button data-f="IRAN">Iran</button><button data-f="ISRAEL">Israel</button><button data-f="GULF">Persian Gulf</button><button data-f="UK">UK</button><button data-f="UN">UN</button><button data-f="US">US</button>
        </span>
      </div>
      <div class="feed-sub" data-for="social" hidden>
        <span class="filters" data-target="social">
          <button data-f="ALL" class="on">All</button><button data-f="X">X</button><button data-f="Bluesky">Bluesky</button><button data-f="Reddit">Reddit</button><button data-f="Telegram">Telegram</button>
        </span>
        <span class="muted unverified">unverified posts</span>
      </div>
      <div class="list feed-list" id="news"></div>
      <div class="list feed-list" id="official" hidden></div>
      <div class="list feed-list" id="social" hidden></div>
    </section>
  </main>

  <section id="breaking" aria-label="Breaking news">
    <span class="bk-label">● BREAKING</span>
    <div class="bk-viewport"><div class="bk-track"></div></div>
  </section>

  <footer id="footer">
    <span>© 2026 Mohammadamin Zare · University College London · All rights reserved</span>
    <span class="muted">Delayed third-party data and AI analysis · not investment advice</span>
  </footer>

  <div id="flash"></div>

  <!-- Generic tool window (flows / curve / scenario / alert settings) -->
  <div id="tool-modal" class="overlay" hidden>
    <div class="tm-box" role="dialog" aria-modal="true" aria-labelledby="tm-title">
      <div class="cm-head"><div><div id="tm-title" class="cm-title"></div><div id="tm-sub" class="cm-sub"></div></div><button id="tm-close" title="Close (Esc)">✕</button></div>
      <div id="tm-body" class="tm-body"></div>
    </div>
  </div>

  <div id="chart-modal" hidden>
    <div class="cm-box" role="dialog" aria-modal="true" aria-labelledby="cm-title">
      <div class="cm-head">
        <div>
          <div id="cm-title" class="cm-title"></div>
          <div id="cm-sub" class="cm-sub"></div>
        </div>
        <div id="cm-quote" class="cm-quote"></div>
        <button id="cm-close" title="Close (Esc)">✕</button>
      </div>
      <div class="cm-controls">
        <span class="filters" id="cm-range">
          <button data-r="1d" class="on">1D</button><button data-r="5d">5D</button><button data-r="1mo">1M</button><button data-r="6mo">6M</button><button data-r="1y">1Y</button><button data-r="5y">5Y</button>
        </span>
        <span class="filters" id="cm-type"><button data-t="candle" class="on">CANDLES</button><button data-t="line">LINE</button></span>
        <label class="tog"><input type="checkbox" id="cm-events" checked /> EVENT MARKERS</label>
        <span id="cm-readout" class="cm-readout"></span>
      </div>
      <div class="cm-body">
        <div class="cm-chartwrap"><div id="cm-chart"></div><div id="cm-msg" class="cm-msg"></div></div>
        <aside class="cm-side">
          <div class="sec">STATISTICS</div>
          <table id="cm-stats" class="cm-stats"></table>
          <div class="sec">EVENTS IN THIS WINDOW</div>
          <div id="cm-events-list" class="cm-events"></div>
        </aside>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="/app.js"></script>
  <script src="/chart.js"></script>
  <script src="/tools.js"></script>
  <script src="/desk.js"></script>
  <script src="/research.js"></script>
  <script src="/replay.js"></script>
  <script src="/breaking.js"></script>
</body>
</html>
