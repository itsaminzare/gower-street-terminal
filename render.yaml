# Copyright (c) 2026 Mohammadamin Zare, University College London. All rights reserved.
services:
  - type: web
    name: gower-street-terminal-sg
    runtime: node
    plan: free               # no card needed; 750 free hours/month covers one service running 24/7
    # aisstream.io limits connections per source IP, and Render's free instances share outbound IPs.
    # Frankfurt's shared IP was saturated ("concurrent connections per user exceeded"); Singapore is less busy.
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true         # every push to main redeploys
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      # Free instances sleep after 15 idle minutes; the server pings its own public URL to stay awake
      - key: KEEP_AWAKE
        value: "1"
      # Secrets: Render asks for these when you create the service. Never commit them.
      - key: AISSTREAM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY   # only needed with AI_PROVIDER=claude
        sync: false
      - key: NTFY_TOPIC
        sync: false
      # Cheap AI + cost controls for a public site (change any time in the Render dashboard)
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ANALYST_MODEL
        value: claude-haiku-5-5
      - key: ANALYST_INTERVAL_MIN
        value: "60"
      - key: ANALYST_DAILY_MAX
        value: "30"
      - key: ANALYST_ALERT_DEBOUNCE_MIN
        value: "20"
      - key: ASK_DAILY_LIMIT
        value: "30"
      - key: ASK_PER_VISITOR_LIMIT
        value: "5"
      - key: MANUAL_RUN_MIN_INTERVAL_MIN
        value: "15"
